# CVE-2022-4981 — DcmQueryRetrieveConfig::readPeerList null pointer deref.
# HostTable is empty, but the AETable entry still names a symbolic peer
# ("caller"). readPeerList iterates a host table with no entries while
# resolving the AE peer list, dereferencing a null list head.
#
# Black-box test artifact: point a dcmqrscp build at this file
#   dcmqrscp -c cve_2022_4981_empty_hosttable.cfg 11114
# and watch for a crash during config load (before any network I/O).
NetworkTCPPort  = 11114
MaxPDUSize      = 16384
MaxAssociations = 4

HostTable BEGIN
HostTable END

VendorTable BEGIN
VendorTable END

AETable BEGIN
DCMQRSCP    /tmp/c-scare-dcmqrscp    RW (50, 1024mb)    caller
AETable END
