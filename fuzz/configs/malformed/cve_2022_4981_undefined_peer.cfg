# CVE-2022-4981 — DcmQueryRetrieveConfig::readPeerList null pointer deref.
# The AETable peer list references the symbolic name "ghost_peer", which is
# never defined in HostTable. readPeerList resolves peer symbols against the
# host table; an unresolved symbol yields a null entry that is then walked.
#
# Black-box test artifact: point a dcmqrscp build at this file
#   dcmqrscp -c cve_2022_4981_undefined_peer.cfg 11114
# and watch for a crash during config load (before any network I/O).
NetworkTCPPort  = 11114
MaxPDUSize      = 16384
MaxAssociations = 4

HostTable BEGIN
caller    = (C-SCARE-FZ, 127.0.0.1, 11112)
HostTable END

VendorTable BEGIN
VendorTable END

AETable BEGIN
DCMQRSCP    /tmp/c-scare-dcmqrscp    RW (50, 1024mb)    ghost_peer
AETable END
